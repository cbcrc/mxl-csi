apiVersion: v1 
kind: ConfigMap 
metadata: 
  name: mxl-mediamtx-config 
  namespace: qvest-mxl-test 
data: 
  mediamtx.yml: | 
    ############################################### 
    # Global settings
    paths:
      # Allow FFmpeg to dynamically publish to any path (e.g. /stream)
      all_others:
        source: publisher
---
apiVersion: v1 
kind: Service 
metadata: 
  name: mediamtx-service-outside 
  namespace: qvest-mxl-test 
spec: 
  selector: 
    app.kubernetes.io/name: mxl-mediamtx
  ports: 
    - name: rtsp
      protocol: TCP
      port: 8554
      targetPort: 8554
      nodePort: 30554
    - protocol: TCP # webRTC 
      port: 8889 # inside 
      targetPort: 8889 # outside
      name: webrtc 
    - protocol: TCP # ctrl API
      port: 9997 # inside 
      targetPort: 9997 # outside 
      name: ctrl-api
  type: NodePort
---
apiVersion: v1 
kind: Service 
metadata: 
  name: mediamtx-service-inside # <-- internal domain name used by FFmpeg
  namespace: qvest-mxl-test 
spec: 
  selector: 
    app.kubernetes.io/name: mxl-mediamtx 
  type: ClusterIP 
  ports: 
    - protocol: TCP 
      port: 8554 
      targetPort: 8554
---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: mxl-mediamtx 
  namespace: qvest-mxl-test 
spec: 
  replicas: 1 
  strategy:
    type: Recreate
  selector: 
    matchLabels: 
      app.kubernetes.io/name: mxl-mediamtx 
  template: 
    metadata: 
      labels: 
        app.kubernetes.io/name: mxl-mediamtx 
    spec: 
      nodeSelector: 
        kubernetes.io/hostname: <nodeName> 
      volumes: 
        - name: config 
          configMap: 
            name: mxl-mediamtx-config 
      containers: 
        - name: mediamtx 
          volumeMounts: 
            - name: config 
              mountPath: /mediamtx.yml 
              subPath: mediamtx.yml 
          image: bluenviron/mediamtx:latest 
          env: 
            - name: MTX_RTSPTRANSPORTS 
              value: tcp
            - name: MTX_LOGLEVEL
              value: debug
          ports:
            - containerPort: 8554 # RTSP 
            - containerPort: 8889 # webRTC 
            - containerPort: 9997 # ctrl API 