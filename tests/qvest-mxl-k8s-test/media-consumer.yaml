apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-k8s-video-flow-reader
  namespace: qvest-mxl-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mxl-k8s-video-flow-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mxl-k8s-video-flow-reader
    spec:
      nodeSelector:
        kubernetes.io/hostname: <nodeName>
      securityContext:
        supplementalGroups: [1000]
      volumes:
        - name: domain
          persistentVolumeClaim:
            claimName: mxl-domain-pvc
      containers:
        - name: ffmpeg
          image: ghcr.io/cbcrc/ffmpeg-mxl-prod:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
            - name: MXL_DOMAIN
              value: "/run/mxl/domain"
            - name: RTSP_URL
              value: "rtsp://mediamtx-service-inside.qvest-mxl-test.svc.cluster.local:8554/stream"
            - name: VIDEO_ID
              value: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
            - name: TRANSCODER_MODE
              value: "cpu"
            - name: FFMPEG_MODE
              value: "cpu"
            - name: MODE
              value: "cpu"
            - name: RTSP_TRANSPORT
              value: "tcp"
          volumeMounts:
            # Mounting the PVC directly to the required domain path
            - name: domain
              mountPath: /run/mxl/domain
          