apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-k8s-video-flow-reader
  namespace: mxl-csi-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mxl-k8s-video-flow-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mxl-k8s-video-flow-reader
    spec:
      nodeSelector:
        kubernetes.io/hostname:
      securityContext:
        supplementalGroups: [1000]
      volumes:
        # CSI Domain Volume
        - name: domain
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteMany"]
                storageClassName: "mxl-domain-sc"
                resources:
                  requests:
                    storage: 1Gi
        # HostPath Volume for Agent Socket
        - name: agent-socket
          hostPath:
            path: /run/mxl/agent.sock
            type: Socket
      containers:
        - name: ffmpeg
          image: ghcr.io/cbcrc/ffmpeg-mxl-prod:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
            - name: MXL_DOMAIN
              value: "/run/mxl/domain"
            - name: RTSP_URL
              value: "rtsp://mediamtx-service-inside.mxl-csi-test.svc.cluster.local:8554/stream"
            - name: VIDEO_ID
              value: "5fbec3b1-1b0f-417d-9059-8b94a47197ed"
            - name: TRANSCODER_MODE
              value: "cpu"
            - name: FFMPEG_MODE
              value: "cpu"
            - name: MODE
              value: "cpu"
            - name: RTSP_TRANSPORT
              value: "tcp"
          volumeMounts:
            # Mount CSI domain
            - name: domain
              mountPath: /run/mxl/domain
            # Mount host agent socket directly into /run/mxl/agent.sock
            - name: agent-socket
              mountPath: /run/mxl/agent.sock