apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mxl-k8s-agent
  namespace: mxl-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: mxl
      app.kubernetes.io/name: mxl-k8s-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
        app.kubernetes.io/instance: mxl
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: mxl-k8s-agent
        app.kubernetes.io/version: 1.0.0-rc.20
        helm.sh/chart: mxl-k8s-1.0.0-rc.20
    spec:
      containers:
      - args:
        - --domain-path=/run/mxl/domain
        - --health-probe-bind-address=:9081
        - --intent-socket=/run/mxl/agent.sock
        - --materialize-timeout=5s
        - --metrics-bind-address=:9082
        - --resync-period=30s
        - --zap-log-level=info
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: FI_PROVIDER
          value: "tcp"
        - name: FI_TCP_IFACE
          value: "black01"
        - name: FI_LOG_LEVEL
          value: "debug"
        image: ghcr.io/qvest-digital/mxl-k8s/agent:v1.0.0-rc.20
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: probe
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: agent
        ports:
        - containerPort: 9081
          name: probe
          protocol: TCP
        - containerPort: 9082
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: probe
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_PTRACE
          readOnlyRootFilesystem: true
          runAsNonRoot: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /run/mxl
          name: mxl-run
      dnsPolicy: ClusterFirst
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: mxl-k8s-agent
      serviceAccountName: mxl-k8s-agent
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /run/mxl
          type: DirectoryOrCreate
        name: mxl-run