{{- if .Values.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mxl-csi.controllerServiceAccountName" . }}
  labels:
    {{- include "mxl-csi.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.node.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mxl-csi.nodeServiceAccountName" . }}
  labels:
    {{- include "mxl-csi.labels" . | nindent 4 }}
{{- end }}
