apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mxl-csi.fullname" . }}-controller
  labels:
    {{- include "mxl-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mxl-csi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mxl-csi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "mxl-csi.controllerServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-provisioner
          image: {{ .Values.controller.provisioner.image }}:{{ .Values.controller.provisioner.tag }}
          imagePullPolicy: {{ .Values.controller.provisioner.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election={{ .Values.controller.provisioner.leaderElection }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: liveness-probe
          image: {{ .Values.controller.livenessProbe.image }}:{{ .Values.controller.livenessProbe.tag }}
          imagePullPolicy: {{ .Values.controller.livenessProbe.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: driver
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint={{ .Values.driver.endpoint }}
            - --node-id={{ .Values.controller.nodeID }}
            - --driver-name={{ .Values.driver.name }}
            - --shared-host-path={{ .Values.driver.sharedHostPath }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
