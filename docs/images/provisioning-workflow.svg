<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220" role="img" aria-labelledby="title desc">
  <title id="title">MXL CSI provisioning workflow</title>
  <desc id="desc">PVC provisioning flow from pod request through controller handling, node publish, tmpfs domain setup, and bind mount.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style>
      .title { font: 700 30px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Helvetica, Arial, sans-serif; fill: #475569; }
      .node { stroke-width: 2; rx: 14; }
      .k8s { fill: #dbeafe; stroke: #2563eb; }
      .controller { fill: #ede9fe; stroke: #7c3aed; }
      .nodeSvc { fill: #dcfce7; stroke: #16a34a; }
      .host { fill: #ffedd5; stroke: #ea580c; }
      .decision { fill: #fef9c3; stroke: #ca8a04; }
      .done { fill: #cffafe; stroke: #0891b2; stroke-width: 3; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edgeLabel { font: 700 14px Helvetica, Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="1220" fill="#ffffff" />
  <text x="700" y="54" text-anchor="middle" class="title">MXL CSI Provisioning Workflow</text>

  <rect x="420" y="90" width="560" height="74" class="node k8s" />
  <text x="700" y="120" text-anchor="middle" class="label">1. Pod requests storage</text>
  <text x="700" y="145" text-anchor="middle" class="small">PVC uses StorageClass mxl-domain-sc</text>

  <rect x="420" y="205" width="560" height="74" class="node k8s" />
  <text x="700" y="235" text-anchor="middle" class="label">2. Kubernetes observes Pending PVC</text>
  <text x="700" y="260" text-anchor="middle" class="small">Provisioner name is mxl.csi.k8s.local</text>

  <rect x="420" y="320" width="560" height="74" class="node controller" />
  <text x="700" y="350" text-anchor="middle" class="label">3. csi-provisioner calls CreateVolume</text>
  <text x="700" y="375" text-anchor="middle" class="small">Request sent over gRPC to the CSI controller</text>

  <rect x="420" y="435" width="560" height="74" class="node controller" />
  <text x="700" y="465" text-anchor="middle" class="label">4. mxl-csi acknowledges volume</text>
  <text x="700" y="490" text-anchor="middle" class="small">No dedicated backend storage is carved</text>

  <rect x="420" y="550" width="560" height="74" class="node controller" />
  <text x="700" y="580" text-anchor="middle" class="label">5. VolumeContext is returned</text>
  <text x="700" y="605" text-anchor="middle" class="small">sharedHostPath, requestedBytes, flowCleanupPolicy</text>

  <rect x="420" y="665" width="560" height="74" class="node k8s" />
  <text x="700" y="695" text-anchor="middle" class="label">6. PersistentVolume is created</text>
  <text x="700" y="720" text-anchor="middle" class="small">PV binds to the original PVC</text>

  <rect x="420" y="780" width="560" height="74" class="node k8s" />
  <text x="700" y="810" text-anchor="middle" class="label">7. Pod is scheduled</text>
  <text x="700" y="835" text-anchor="middle" class="small">kubelet resolves the bound PV</text>

  <rect x="420" y="895" width="560" height="74" class="node nodeSvc" />
  <text x="700" y="925" text-anchor="middle" class="label">8. kubelet calls NodePublishVolume</text>
  <text x="700" y="950" text-anchor="middle" class="small">Request reaches the node CSI socket</text>

  <polygon points="700,1005 910,1065 700,1125 490,1065" class="node decision" />
  <text x="700" y="1058" text-anchor="middle" class="label">9. domain_def.json</text>
  <text x="700" y="1083" text-anchor="middle" class="small">present on this node?</text>

  <rect x="60" y="1028" width="390" height="74" class="node host" />
  <text x="255" y="1058" text-anchor="middle" class="label">10a. First publish</text>
  <text x="255" y="1083" text-anchor="middle" class="small">create path, mount tmpfs, set permissions</text>

  <rect x="950" y="1028" width="390" height="74" class="node host" />
  <text x="1145" y="1058" text-anchor="middle" class="label">10b. Domain already exists</text>
  <text x="1145" y="1083" text-anchor="middle" class="small">remount tmpfs if active PVC sizes grew</text>

  <rect x="420" y="1140" width="560" height="54" class="node nodeSvc" />
  <text x="700" y="1173" text-anchor="middle" class="label">11. Bind mount /run/mxl/domain into the pod volume</text>

  <path d="M 700 164 V 205" class="edge" />
  <path d="M 700 279 V 320" class="edge" />
  <path d="M 700 394 V 435" class="edge" />
  <path d="M 700 509 V 550" class="edge" />
  <path d="M 700 624 V 665" class="edge" />
  <path d="M 700 739 V 780" class="edge" />
  <path d="M 700 854 V 895" class="edge" />
  <path d="M 700 969 V 1005" class="edge" />
  <path d="M 490 1065 H 450" class="edge" />
  <text x="468" y="1052" text-anchor="middle" class="edgeLabel">no</text>
  <path d="M 910 1065 H 950" class="edge" />
  <text x="932" y="1052" text-anchor="middle" class="edgeLabel">yes</text>
  <path d="M 255 1102 C 255 1160 360 1167 420 1167" class="edge" />
  <path d="M 1145 1102 C 1145 1160 1040 1167 980 1167" class="edge" />
</svg>
