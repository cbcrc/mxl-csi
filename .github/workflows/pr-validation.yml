name: PR Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --source=/repo --no-banner --redact --exit-code=1

      - name: Sensitive literal scan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD)
          else
            mapfile -t files < <(git ls-files)
          fi

          scan_file() {
            local file="$1"

            if grep -nE -- '\b(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b' "$file"; then
              echo "::error file=${file}::Private IPv4 literal found"
              return 1
            fi

            if grep -nEi -- '\b((tor|mtl)[a-z0-9]{9,11}|[a-z0-9-]*(corp|internal|dmz|vpn)[a-z0-9-]*)\b' "$file"; then
              echo "::error file=${file}::Environment-specific hostname or network label found"
              return 1
            fi

            if grep -nEi -- '-----BEGIN (RSA|DSA|EC|OPENSSH|PGP)? ?PRIVATE KEY-----|authorization:[[:space:]]*bearer[[:space:]]+[A-Za-z0-9._~+/-]+|\b(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+)\b|\b(password|token|secret|api[_-]?key)[[:space:]]*[:=][[:space:]]*[^[:space:]${}<>]+' "$file"; then
              echo "::error file=${file}::Secret-like literal found"
              return 1
            fi
          }

          failed=false
          for file in "${files[@]}"; do
            case "$file" in
              .github/workflows/pr-validation.yml|docs/images/*|licenses/*|go.sum)
                continue
                ;;
            esac

            if [[ -f "$file" && ! -L "$file" ]]; then
              scan_file "$file" || failed=true
            fi
          done

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --quiet pyyaml

          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          failed = False
          for path in sorted(Path('.').rglob('*')):
              if path.parts[0] == '.git':
                  continue
              if path.suffix not in {'.yaml', '.yml'}:
                  continue
              try:
                  with path.open('r', encoding='utf-8') as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as exc:
                  print(f'::error file={path}::YAML syntax error: {exc}')
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Detect Helm chart changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi

          if git diff --name-only "$BASE_REF" HEAD -- deploy/helm/mxl-csi/Chart.yaml deploy/helm/mxl-csi/values.yaml deploy/helm/mxl-csi/templates/ | grep -q .; then
            echo "helm_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Helm
        if: steps.changes.outputs.helm_changed == 'true'
        uses: azure/setup-helm@v5

      - name: Helm template
        if: steps.changes.outputs.helm_changed == 'true'
        run: helm template mxl-csi deploy/helm/mxl-csi >/dev/null