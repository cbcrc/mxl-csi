name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/mxl-csi/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

env:
  CHART_DIR: deploy/helm/mxl-csi
  OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint "$CHART_DIR"

      - name: Helm package
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Upload packaged chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: mxl-csi-chart
          path: dist/*.tgz

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        run: |
          helm push dist/*.tgz oci://$OCI_REGISTRY
