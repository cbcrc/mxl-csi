name: Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/mxl-csi/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

env:
  CHART_DIR: deploy/helm/mxl-csi
  OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint "$CHART_DIR"

      - name: Helm package
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --destination dist

      - name: Upload packaged chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxl-csi-chart
          path: dist/*.tgz

      - name: Detect publish credentials
        id: auth_mode
        shell: bash
        run: |
          set -euo pipefail

          CAN_PUBLISH=false
          if [[ -n "${{ secrets.GHCR_PUSH_USERNAME }}" && -n "${{ secrets.GHCR_PUSH_TOKEN }}" ]]; then
            CAN_PUBLISH=true
          fi

          echo "can_publish=${CAN_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.auth_mode.outputs.can_publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Push chart to OCI registry
        if: steps.auth_mode.outputs.can_publish == 'true'
        run: |
          helm push dist/*.tgz oci://$OCI_REGISTRY

      - name: Publish decision summary
        if: always()
        run: |
          echo "can_publish=${{ steps.auth_mode.outputs.can_publish }}"
          if [[ "${{ steps.auth_mode.outputs.can_publish }}" != "true" ]]; then
            echo "publish skipped: GHCR_PUSH_USERNAME and/or GHCR_PUSH_TOKEN secret is not configured"
          fi
